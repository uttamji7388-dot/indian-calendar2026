
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Indian Calendar 2026–2030</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>🇮🇳 Indian Calendar</h1>
        <p>Calendar, Holidays & Festivals (2026–2030)</p>
    </header>

    <main class="container">
        <div class="controls">
            <label for="yearSelect">Select Year:</label>

            <select id="yearSelect">
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
            </select>
        </div>

        <div class="legend">
            <span><i class="dot sunday-dot"></i> Sunday</span>
            <span><i class="dot holiday-dot"></i> Holiday / Festival</span>
            <span><i class="dot today-dot"></i> Today</span>
        </div>

        <div id="yearCalendar" class="year-calendar"></div>

        <p class="note">
            Note: Festival dates can vary by region and local calendar.
            Verify dates with an official local holiday calendar.
        </p>
    </main>

    <footer>
        <p>Indian Calendar Project | HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
